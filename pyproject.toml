[project]
name = "rag"
version = "0.1.0"
description = "EU AI Act Compliance Q&A RAG Pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=2.29.0",
    "anthropic>=0.40.0",
    "chromadb>=0.6.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.25.0",
    "pdfplumber>=0.11.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "streamlit>=1.40.0",
    "sentence-transformers>=3.3.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
